name: RouteTrack spreadsheet sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger RouteTrack automatic spreadsheet sync
        env:
          ROUTETRACK_URL: https://final-route-track.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET GitHub Actions secret is not configured."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${ROUTETRACK_URL}/api/sync/spreadsheet"
          echo
